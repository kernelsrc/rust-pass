[package]
name = "rust-pass"
version = "0.1.0"
edition = "2021"
description = "A secure local CLI password manager"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/rust-pass"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["std", "serde"] }
base64 = "0.21"
arboard = "3.7"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
dialoguer = "0.11"
